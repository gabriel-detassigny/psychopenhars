# --- psychopenhars: legacy URL redirects (after the host's HTTPS rule, ABOVE "# BEGIN WordPress") ---
<IfModule mod_rewrite.c>
RewriteEngine On

# Scheme for absolute redirect targets. OVH terminates TLS upstream and
# exposes it as %{ENV:HTTPS}; plain Apache (local wp-env) uses %{HTTPS}.
# Absolute targets avoid Apache emitting "https://host:443/..." Locations.
RewriteRule ^ - [E=PSY_SCHEME:http]
RewriteCond %{ENV:HTTPS} =on [OR]
RewriteCond %{HTTPS} =on
RewriteRule ^ - [E=PSY_SCHEME:https]

# www -> apex
RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
RewriteRule ^ %{ENV:PSY_SCHEME}://%1%{REQUEST_URI} [R=301,L,NE]

# Removed pages and the old front-page slug -> home
RewriteRule ^(?:index\.php/)?(?:colibri-wp|sample-page|cabinet-de-psychologues)/?$ %{ENV:PSY_SCHEME}://%{HTTP_HOST}/ [R=301,L]

# Old PATHINFO permalinks: /index.php/foo/ -> /foo/ (pages, feeds, wp-json...)
RewriteRule ^index\.php/(.+)$ %{ENV:PSY_SCHEME}://%{HTTP_HOST}/$1 [R=301,L,NE]
</IfModule>
# --- end psychopenhars redirects ---
